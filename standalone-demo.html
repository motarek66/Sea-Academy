<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEA ACADEMY — Vocabulary Poster Studio</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7f6;color:#17213c}button,input,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-columns:280px 1fr 300px;grid-template-rows:58px 1fr}.top{grid-column:1/-1;background:#fff;border-bottom:1px solid #e5eae8;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.row{display:flex;align-items:center;gap:8px}.logo{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid #e5eae8;display:flex;align-items:center;justify-content:center;padding:2px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;display:block}.name{border:0;font-weight:800;width:190px}.saved{font-size:12px;color:#667085}.btn{border:1px solid #e5eae8;background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.primary{background:#18a674;color:#fff;border-color:#18a674;font-weight:800}.left,.right{background:#fff;min-height:0;overflow:auto}.left{border-right:1px solid #e5eae8}.right{border-left:1px solid #e5eae8;padding:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px;border-bottom:1px solid #e5eae8}.tabs button{border:0;border-radius:8px;padding:8px;background:#fff}.tabs .active{background:#eaf8f2;color:#12855d;font-weight:800}.list{padding:9px}.page{display:flex;gap:10px;align-items:center;width:100%;border:1px solid transparent;background:#fff;border-radius:10px;padding:8px;cursor:pointer;text-align:left}.page.active{background:#f5fbf8;border-color:#d6eee4}.thumb{width:48px;height:70px;border:1px solid #dfe7e4;border-radius:4px;background:linear-gradient(#dff5ec 0 18%,#fff 18%);box-shadow:0 2px 6px #0001}.page small{display:block;color:#667085;margin-top:3px}.workspace{min-width:0;min-height:0;overflow:auto;padding:70px 80px 140px;position:relative}.poster{width:621px;height:1000px;background:white;margin:auto;box-shadow:0 20px 55px #17213c24;position:relative;overflow:hidden}.wave{position:absolute;width:310px;height:310px;border:38px solid #dff5ec;border-radius:50%;top:-220px;right:-90px}.head{height:210px;padding:45px 31px}.level{color:#18a674;font-size:11px;font-weight:900;letter-spacing:.15em}.head h1{font-size:38px;line-height:.95;margin:10px 0 0}.head h1 span{font-size:21px;display:block;font-weight:600;margin-bottom:5px}.pill{margin-top:18px;width:169px;height:33px;border-radius:8px;background:#18a674;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}.grid{position:absolute;left:31px;top:224px;display:grid;grid-template-columns:repeat(3,173px);grid-auto-rows:83px;gap:17px 20px}.card{border:1px solid #e6edeb;border-radius:12px;background:#fff;display:grid;grid-template-columns:64px 1fr;align-items:center;padding:8px;position:relative;cursor:pointer}.card.sel{outline:2px solid #18a674;outline-offset:2px}.num{position:absolute;left:-8px;top:-7px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#18a674;color:#fff;font-size:8px;font-weight:800}.pic{width:54px;height:54px;border-radius:10px;background:#f2f7f5;display:grid;place-items:center;overflow:hidden;color:#12855d;font-weight:900}.pic img{width:100%;height:100%;object-fit:contain}.word{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.foot{position:absolute;left:31px;right:31px;bottom:28px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;color:#667085;font-size:9px}.line{height:1px;background:#dfe7e4}.right label{display:block;font-size:12px;font-weight:800;margin:12px 0}.right input,.right textarea{width:100%;border:1px solid #e5eae8;border-radius:9px;padding:9px;margin-top:6px}.right textarea{height:120px;resize:vertical}.imagebox{height:150px;background:#f4f7f6;border:1px solid #e5eae8;border-radius:11px;display:grid;place-items:center;overflow:hidden}.imagebox img{width:100%;height:100%;object-fit:contain}.muted{color:#667085;font-size:12px;line-height:1.5}.modalbg{display:none;position:fixed;inset:0;background:#0d211a66;z-index:10;place-items:center}.modal{background:#fff;border-radius:16px;width:min(760px,90vw);max-height:84vh;overflow:auto;padding:18px}.results{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.res{border:1px solid #e5eae8;border-radius:10px;overflow:hidden;background:#fff;padding:0;cursor:pointer}.res img{width:100%;height:120px;object-fit:cover;display:block}.res div{padding:7px;font-size:10px}.new{position:absolute;left:14px;bottom:14px}.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #e5eae8;padding:5px;border-radius:10px;display:flex;gap:8px;align-items:center}@media(max-width:950px){.app{grid-template-columns:1fr}.left,.right{display:none}.top{grid-column:1}.workspace{padding-left:15px;padding-right:15px}}
</style></head><body><div class="app"><header class="top"><div class="row"><div class="logo"><img src="./public/poster-assets/brand-logo.svg" alt="SEA ACADEMY" onerror="this.src='/poster-assets/brand-logo.svg'"></div><input id="projectName" class="name" value="SEA ACADEMY"><span class="saved">✓ Saved locally</span></div><div class="row"><button class="btn" id="lang">AR</button><button class="btn primary" onclick="window.print()">Export / Print</button></div></header><aside class="left"><div class="tabs"><button class="active">Pages</button><button onclick="alert('Use the inspector and poster cards in this standalone demo.')">Words</button></div><div id="pages" class="list"></div><button class="btn new" onclick="openBulk()">+ New word list</button></aside><main class="workspace"><div class="poster" id="poster"><div class="wave"></div><div class="head"><div class="level">LEVEL <span id="levelView">A1</span></div><h1><span id="topView">Everyday</span><b id="mainView">Vocabulary</b></h1><div class="pill" id="catView">Daily Life</div></div><div id="grid" class="grid"></div><div class="foot"><b>SEA ACADEMY · streetenglish.net</b><div class="line"></div><b id="pageNo">01</b></div></div><div class="nav"><button class="btn" onclick="go(-1)">‹</button><span id="navText">1 / 1</span><button class="btn" onclick="go(1)">›</button></div></main><aside class="right" id="inspector"><h3>Project settings</h3><label>Level<input id="level" value="A1"></label><label>Title top<input id="titleTop" value="Everyday"></label><label>Main title<input id="titleMain" value="Vocabulary"></label><label>Category<input id="category" value="Daily Life"></label><p class="muted">Select a vocabulary card to edit its word and replace its image using Openverse.</p></aside></div><div class="modalbg" id="bulkBg"><div class="modal"><div class="row" style="justify-content:space-between"><h2>Generate vocabulary posters</h2><button class="btn" onclick="closeBulk()">✕</button></div><p class="muted">One word per line, comma-separated, or <code>word | meaning</code>.</p><textarea id="bulk" style="width:100%;height:250px;border:1px solid #e5eae8;border-radius:10px;padding:12px">cat
dog
book
chair
water
banana
car
shoe
clock
phone
ball
flower
fish
bird
key
bag
shirt
table
pen
light | lamp
bank | financial institution
river
train</textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeBulk()">Cancel</button><button class="btn primary" onclick="generate()">Generate posters</button></div></div></div><div class="modalbg" id="imgBg"><div class="modal"><div class="row" style="justify-content:space-between"><div><small style="color:#12855d;font-weight:900">IMAGE PICKER</small><h2 id="imgTitle" style="margin-top:3px"></h2></div><button class="btn" onclick="closeImages()">✕</button></div><div class="row"><input id="query" style="flex:1;border:1px solid #e5eae8;border-radius:9px;padding:10px"><button class="btn primary" onclick="searchImages()">Search</button></div><div id="results" class="results"></div></div></div><script>
const KEY='vps-standalone-v2';let selected=null,page=0;let data=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'SEA ACADEMY',level:'A1',top:'Everyday',main:'Vocabulary',category:'Daily Life',items:parse(document.getElementById('bulk').value)};function parse(s){return s.split(/\n|\t|,/).map(x=>x.trim().replace(/^\d+[.)-]\s*/,'' )).filter(Boolean).map((x,i)=>{let [word,hint]=x.split('|').map(v=>v&&v.trim());return{id:crypto.randomUUID(),word,hint:hint||'',image:null,order:i+1}})}function save(){data.name=document.getElementById('projectName').value;localStorage.setItem(KEY,JSON.stringify(data))}function pages(){let a=[];for(let i=0;i<data.items.length;i+=21)a.push(data.items.slice(i,i+21));return a.length?a:[[]]}function render(){document.getElementById('levelView').textContent=data.level;document.getElementById('topView').textContent=data.top;document.getElementById('mainView').textContent=data.main;document.getElementById('catView').textContent=data.category;document.getElementById('projectName').value=data.name;let ps=pages();page=Math.max(0,Math.min(page,ps.length-1));document.getElementById('pages').innerHTML=ps.map((p,i)=>`<button class="page ${i===page?'active':''}" onclick="page=${i};render()"><div class="thumb"></div><div><b>Page ${i+1}</b><small>${i*21+1}–${i*21+p.length}</small></div></button>`).join('');document.getElementById('grid').innerHTML=Array.from({length:21},(_,i)=>{let it=ps[page][i];if(!it)return`<div class="card" style="opacity:.16"></div>`;return`<div class="card ${selected===it.id?'sel':''}" onclick="selectItem('${it.id}')"><span class="num">${page*21+i+1}</span><span class="pic">${it.image?`<img src="${it.image}" alt="">`:it.word.slice(0,2).toUpperCase()}</span><span class="word">${esc(it.word)}</span></div>`}).join('');document.getElementById('pageNo').textContent=String(page+1).padStart(2,'0');document.getElementById('navText').textContent=`${page+1} / ${ps.length}`;renderInspector();save()}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function go(d){page+=d;render()}function selectItem(id){selected=id;render()}function renderInspector(){let box=document.getElementById('inspector'),it=data.items.find(x=>x.id===selected);if(!it){box.innerHTML=`<h3>Project settings</h3><label>Level<input id="level" value="${esc(data.level)}"></label><label>Title top<input id="titleTop" value="${esc(data.top)}"></label><label>Main title<input id="titleMain" value="${esc(data.main)}"></label><label>Category<input id="category" value="${esc(data.category)}"></label><p class="muted">Select a vocabulary card to edit its word and replace its image using Openverse.</p>`;['level','titleTop','titleMain','category'].forEach(id=>document.getElementById(id).oninput=e=>{let map={level:'level',titleTop:'top',titleMain:'main',category:'category'};data[map[id]]=e.target.value;render()});return}box.innerHTML=`<h3>Vocabulary card</h3><label>Word<input id="wordEdit" value="${esc(it.word)}"></label><label>Meaning / search hint<input id="hintEdit" value="${esc(it.hint||'')}"></label><label>Selected image<div class="imagebox">${it.image?`<img src="${it.image}">`:'No image selected'}</div></label><button class="btn" style="width:100%" onclick="openImages()">Replace image</button><button class="btn" style="width:100%;margin-top:8px;color:#b42318" onclick="removeItem()">Remove item</button>`;document.getElementById('wordEdit').oninput=e=>{it.word=e.target.value;save();document.querySelectorAll('.word')[((it.order-1)%21)]?.replaceChildren(e.target.value)};document.getElementById('hintEdit').oninput=e=>{it.hint=e.target.value;save()}}function removeItem(){data.items=data.items.filter(x=>x.id!==selected).map((x,i)=>({...x,order:i+1}));selected=null;render()}function openBulk(){document.getElementById('bulkBg').style.display='grid'}function closeBulk(){document.getElementById('bulkBg').style.display='none'}function generate(){data.items=parse(document.getElementById('bulk').value);page=0;selected=null;closeBulk();render()}function openImages(){let it=data.items.find(x=>x.id===selected);if(!it)return;document.getElementById('imgTitle').textContent=it.word;document.getElementById('query').value=[it.word,it.hint].filter(Boolean).join(' ');document.getElementById('imgBg').style.display='grid';searchImages()}function closeImages(){document.getElementById('imgBg').style.display='none'}async function searchImages(){let q=document.getElementById('query').value.trim(),out=document.getElementById('results');out.innerHTML='<p class="muted">Searching licensed media…</p>';try{let r=await fetch('https://api.openverse.org/v1/images/?q='+encodeURIComponent(q)+'&page_size=20&mature=false'),j=await r.json(),arr=j.results||[];out.innerHTML=arr.map(x=>`<button class="res" onclick="useImage('${encodeURIComponent(x.thumbnail||x.url)}')"><img src="${x.thumbnail||x.url}" alt=""><div>${x.width||'?'} × ${x.height||'?'} · ${x.license||''}</div></button>`).join('')||'<p class="muted">No results. Try a clearer meaning.</p>'}catch(e){out.innerHTML='<p class="muted">Image search is unavailable. The editor is still safe locally.</p>'}}function useImage(u){let it=data.items.find(x=>x.id===selected);if(!it)return;it.image=decodeURIComponent(u);closeImages();render()}document.getElementById('projectName').oninput=e=>{data.name=e.target.value;save()};document.getElementById('lang').onclick=()=>{let ar=document.documentElement.lang==='ar';document.documentElement.lang=ar?'en':'ar';document.body.dir=ar?'ltr':'rtl';document.getElementById('lang').textContent=ar?'AR':'EN'};render();
</script></body></html>
